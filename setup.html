<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7fa" />
    <meta name="description" content="Create a date-plan link." />
    <title>set up the date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="setup-page">
      <div class="setup-shell">
        <div class="card setup-card">
          <form class="setup-form" id="setup-form">
            <fieldset class="person-field field-wide">
              <legend>Who’s setting up the date?</legend>
              <div class="person-picker">
                <input id="setter-kalilu" name="setter" type="radio" value="kalilu" />
                <label for="setter-kalilu">kalilu</label>
                <input id="setter-nick" name="setter" type="radio" value="nick" checked />
                <label for="setter-nick">nick</label>
              </div>
            </fieldset>
            <div class="field field-wide">
              <label for="title">The plan</label>
              <input id="title" name="title" required />
            </div>
            <div class="field">
              <label for="date">Date</label>
              <input id="date" name="date" type="date" required />
            </div>
            <div class="field">
              <label for="time">Time</label>
              <input id="time" name="time" type="time" required />
            </div>
            <div class="field">
              <label for="mode">Where</label>
              <select id="mode" name="mode">
                <option value="in-person">In person</option>
                <option value="remote">Remote</option>
              </select>
            </div>
            <div class="field">
              <label for="location" id="location-label">Location</label>
              <input id="location" name="location" required />
            </div>
            <div class="field field-wide">
              <label for="note">Details (optional)</label>
              <textarea id="note" name="note"></textarea>
            </div>
            <button class="button button-primary" type="submit">send invite</button>
          </form>

          <div class="link-result" id="link-result" hidden>
            <label for="share-link">send this link</label>
            <div class="link-row">
              <input id="share-link" readonly />
              <button class="button button-secondary" id="copy-link" type="button">copy</button>
            </div>
            <div class="result-actions">
              <a class="button button-primary messages-link" id="messages-link" href="#">send in messages</a>
              <a class="preview-link" id="preview-link" href="index.html" target="_blank" rel="noopener">preview the page</a>
              <span id="copy-status" aria-live="polite"></span>
            </div>
          </div>
        </div>

      </div>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
